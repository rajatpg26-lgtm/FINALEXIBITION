<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piece by Piece — An Assembly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f4ef;
    --paper-2:#efece4;
    --ink:#1c1b18;
    --ink-soft:rgba(28,27,24,0.55);
    --ink-faint:rgba(28,27,24,0.32);
    --line:rgba(28,27,24,0.14);
    --accent:#3a4f45; /* pine, pulled from the artwork */
    --accent-soft:rgba(58,79,69,0.5);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    *{ scroll-behavior:auto !important; }
  }

  /* the tall spacer that gives us scroll distance to drive the assembly */
  .scroll-track{
    position:relative;
    width:100%;
    height:520vh;
  }

  .stage{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 8%, #faf9f5 0%, var(--paper) 55%, var(--paper-2) 100%);
  }

  canvas#puzzleCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    transform-origin:50% 50%;
    transition:transform 1.1s cubic-bezier(.19,1,.22,1);
    will-change:transform;
  }

  /* ---------- fixed chrome ---------- */

  .chrome{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:5;
  }

  .corner{
    position:absolute;
    font-size:12px;
    letter-spacing:0.06em;
    color:var(--ink-faint);
    line-height:1;
  }

  .corner.tl{ top:32px; left:32px; }
  .corner.tl .label{ display:block; }
  .corner.tl .sub{
    display:block;
    margin-top:6px;
    font-size:11px;
    color:var(--ink-faint);
    max-width:150px;
    letter-spacing:0.02em;
  }

  .corner.br{
    top:auto; left:auto;
    bottom:32px; right:32px;
    text-align:right;
  }

  .progress-count{
    font-variant-numeric:tabular-nums;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }

  /* thin vertical progress rail, right edge */
  .rail{
    position:absolute;
    top:96px;
    bottom:96px;
    right:34px;
    width:1px;
    background:var(--line);
  }
  .rail-fill{
    position:absolute;
    top:0; left:0;
    width:100%;
    background:var(--accent-soft);
    height:0%;
    transition:height 0.05s linear;
  }

  /* center intro / mid / outro text, all share the same slot */
  .center-text{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-46%);
    text-align:center;
    width:min(560px, 82vw);
  }

  .intro{
    opacity:1;
    transition:opacity 0.6s ease;
  }

  .intro .kicker{
    font-size:12px;
    letter-spacing:0.12em;
    color:var(--ink-faint);
    margin-bottom:14px;
  }

  .intro .invite{
    font-family:'Fraunces', serif;
    font-weight:300;
    font-size:clamp(22px, 3vw, 30px);
    color:var(--ink-soft);
    letter-spacing:0.01em;
  }

  .intro .arrow{
    margin-top:26px;
    font-size:15px;
    color:var(--ink-faint);
    animation:drift 2.6s ease-in-out infinite;
  }

  @keyframes drift{
    0%,100%{ transform:translateY(0); opacity:0.5;}
    50%{ transform:translateY(8px); opacity:1;}
  }

  .mid-caption{
    position:absolute;
    left:50%;
    bottom:64px;
    transform:translateX(-50%);
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--ink-faint);
    opacity:0;
    transition:opacity 0.5s ease;
    white-space:nowrap;
  }

  .finale{
    opacity:0;
    transition:opacity 1.1s ease 0.15s;
  }

  .finale .headline{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-size:clamp(34px, 5.4vw, 64px);
    letter-spacing:-0.01em;
    line-height:1.02;
    color:var(--ink);
  }

  .finale .sub{
    margin-top:16px;
    font-size:16px;
    color:var(--ink-soft);
    font-weight:300;
  }

  .finale .replay{
    margin-top:40px;
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--ink-faint);
  }

  .grain{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0.035;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  @media (max-width:640px){
    .corner.tl{ top:22px; left:20px; }
    .corner.br{ bottom:22px; right:20px; }
    .rail{ right:20px; top:74px; bottom:74px; }
  }
</style>
</head>
<body>

<div class="scroll-track">
  <div class="stage">
    <canvas id="puzzleCanvas"></canvas>

    <div class="chrome">
      <div class="corner tl">
        <span class="label">PUZZLE / 001</span>
        <span class="sub" id="cornerSub">A mountain crossing, taken apart and put back together.</span>
      </div>

      <div class="corner br">
        <span class="progress-count" id="progressCount">00%</span>
      </div>

      <div class="rail"><div class="rail-fill" id="railFill"></div></div>

      <div class="center-text intro" id="intro">
        <div class="kicker">PUZZLE / 001 — ASSEMBLY</div>
        <div class="invite">SCROLL TO BEGIN</div>
        <div class="arrow">↓</div>
      </div>

      <div class="mid-caption" id="midCaption">PUTTING THE PIECES TOGETHER</div>

      <div class="center-text finale" id="finale">
        <div class="headline">Piece by piece.</div>
        <div class="sub">Everything comes together.</div>
        <div class="replay">SCROLL UP TO REPLAY</div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</div>

  var canvas = document.getElementById('puzzleCanvas');
  var ctx = canvas.getContext('2d');

  var introEl = document.getElementById('intro');
  var finaleEl = document.getElementById('finale');
  var midCaptionEl = document.getElementById('midCaption');
  var progressCountEl = document.getElementById('progressCount');
  var railFillEl = document.getElementById('railFill');

  var DPR = Math.min(window.devicePixelRatio || 1, 2);

  var img = new Image();
  var imgReady = false;
  img.onload = function(){
    imgReady = true;
    buildLayout();
    requestAnimationFrame(loop);
  };
  img.src = IMG_SRC;

  // ---------------------------------------------------------------
  // layout state
  // ---------------------------------------------------------------
  var W = 0, H = 0;              // viewport css px
  var cols = 8, rows = 8;
  var puzzleW = 0, puzzleH = 0;  // css px size of the assembled artwork
  var puzzleX = 0, puzzleY = 0;  // css px top-left of the assembled artwork
  var cellW = 0, cellH = 0;
  var tabSize = 0;

  var pieces = [];

  function isMobile(){ return window.innerWidth < 700; }

  function rand(seed){
    // simple deterministic-ish pseudo random per call, fine since we
    // only need visual variety, not reproducibility across sessions
    return Math.random.call(Math, seed);
  }

  function buildLayout(){
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    cols = isMobile() ? 6 : 8;
    var ratio = img.naturalHeight / img.naturalWidth;
    rows = Math.max(4, Math.round(cols * ratio));

    var maxW = isMobile() ? W * 0.86 : Math.min(W * 0.56, H * 0.66, 620);
    puzzleW = maxW;
    puzzleH = puzzleW * ratio;

    // keep it comfortably inside the viewport vertically too
    if (puzzleH > H * 0.7){
      puzzleH = H * 0.7;
      puzzleW = puzzleH / ratio;
    }

    puzzleX = (W - puzzleW) / 2;
    puzzleY = (H - puzzleH) / 2;

    cellW = puzzleW / cols;
    cellH = puzzleH / rows;
    tabSize = Math.min(cellW, cellH) * 0.26;

    generatePieces();
  }

  function generatePieces(){
    // sign of each interior edge, shared between the two pieces that meet there
    var horiz = []; // horiz[r][c]: edge between row r/r+1 at column c
    for (var r = 0; r < rows - 1; r++){
      horiz.push([]);
      for (var c = 0; c < cols; c++){
        horiz[r].push(Math.random() > 0.5 ? 1 : -1);
      }
    }
    var vert = []; // vert[r][c]: edge between col c/c+1 at row r
    for (var r2 = 0; r2 < rows; r2++){
      vert.push([]);
      for (var c2 = 0; c2 < cols - 1; c2++){
        vert[r2].push(Math.random() > 0.5 ? 1 : -1);
      }
    }

    pieces = [];
    var index = 0;
    var total = rows * cols;

    for (var row = 0; row < rows; row++){
      for (var col = 0; col < cols; col++){

        var top    = row === 0 ? 0 : -horiz[row - 1][col];
        var bottom = row === rows - 1 ? 0 : horiz[row][col];
        var left   = col === 0 ? 0 : -vert[row][col - 1];
        var right  = col === cols - 1 ? 0 : vert[row][col];

        var fx = puzzleX + col * cellW;
        var fy = puzzleY + row * cellH;

        // stagger: pieces enter across the scroll range in roughly
        // index order but with heavy jitter, so it never feels like
        // a metronome and never feels simultaneous
        var t = index / (total - 1); // 0..1 across the grid
        var delay = 0.03 + t * 0.62 + (Math.random() - 0.5) * 0.12;
        delay = Math.max(0.02, Math.min(delay, 0.74));
        var duration = 0.22 + Math.random() * 0.18;

        var angle = Math.random() * Math.PI * 2;
        var burst = 260 + Math.random() * 620; // travel distance in css px
        if (Math.random() < 0.18) burst += 400; // a few come from far away

        pieces.push({
          row: row, col: col,
          fx: fx, fy: fy,
          cx: fx + cellW / 2, cy: fy + cellH / 2, // center, rotation pivot
          edges: { top: top, right: right, bottom: bottom, left: left },
          startDX: Math.cos(angle) * burst,
          startDY: Math.sin(angle) * burst,
          startRot: (Math.random() - 0.5) * (Math.random() < 0.3 ? Math.PI * 1.5 : Math.PI * 0.9),
          delay: delay,
          duration: duration,
          wobbleSeed: Math.random() * 1000,
          wobbleAmp: 6 + Math.random() * 10,
          settleOvershoot: 0.06 + Math.random() * 0.08
        });

        index++;
      }
    }
  }

  // ---------------------------------------------------------------
  // path / drawing
  // ---------------------------------------------------------------

  function tabEdge(ctx, x0, y0, x1, y1, sign, size){
    if (!sign){ ctx.lineTo(x1, y1); return; }
    var dx = x1 - x0, dy = y1 - y0;
    var len = Math.hypot(dx, dy) || 1;
    var ux = dx / len, uy = dy / len;
    var nx = -uy * sign, ny = ux * sign;
    var t = size;

    function P(f, d){
      d = d || 0;
      return { x: x0 + dx * f + nx * d, y: y0 + dy * f + ny * d };
    }

    var p1 = P(0.32);
    var p3 = P(0.5, t);
    var p4 = P(0.68, t * 0.62);
    var p5 = P(0.68);

    ctx.lineTo(p1.x, p1.y);
    ctx.bezierCurveTo(P(0.32, t * 0.62).x, P(0.32, t * 0.62).y, P(0.40, t * 1.08).x, P(0.40, t * 1.08).y, p3.x, p3.y);
    ctx.bezierCurveTo(P(0.60, t * 1.08).x, P(0.60, t * 1.08).y, p4.x, p4.y, p5.x, p5.y);
    ctx.lineTo(x1, y1);
  }

  function tracePiece(ctx, piece){
    var x0 = piece.fx, y0 = piece.fy;
    var x1 = piece.fx + cellW, y1 = piece.fy + cellH;

    ctx.beginPath();
    ctx.moveTo(x0, y0);
    tabEdge(ctx, x0, y0, x1, y0, piece.edges.top, tabSize);    // top
    tabEdge(ctx, x1, y0, x1, y1, piece.edges.right, tabSize);  // right
    tabEdge(ctx, x1, y1, x0, y1, piece.edges.bottom, tabSize); // bottom
    tabEdge(ctx, x0, y1, x0, y0, piece.edges.left, tabSize);   // left
    ctx.closePath();
  }

  // ---------------------------------------------------------------
  // easing
  // ---------------------------------------------------------------
  function easeOutBack(x, overshoot){
    var c1 = overshoot;
    var c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

  // ---------------------------------------------------------------
  // scroll -> progress
  // ---------------------------------------------------------------
  var progress = 0;
  var targetProgress = 0;

  function readScroll(){
    var track = document.querySelector('.scroll-track');
    var max = track.offsetHeight - window.innerHeight;
    var y = window.scrollY || window.pageYOffset;
    targetProgress = max > 0 ? clamp(y / max, 0, 1) : 0;
  }

  window.addEventListener('scroll', readScroll, { passive: true });
  window.addEventListener('resize', function(){
    if (imgReady){ buildLayout(); }
  });

  readScroll();

  // ---------------------------------------------------------------
  // per-frame render
  // ---------------------------------------------------------------
  var lastUiState = -1;

  function updateChrome(p){
    // intro
    introEl.style.opacity = p < 0.035 ? 1 : Math.max(0, 1 - (p - 0.035) / 0.05);
    introEl.style.pointerEvents = 'none';

    // mid caption window
    var midOpacity = 0;
    if (p > 0.16 && p < 0.86){
      var fadeIn = clamp((p - 0.16) / 0.05, 0, 1);
      var fadeOut = clamp((0.86 - p) / 0.06, 0, 1);
      midOpacity = Math.min(fadeIn, fadeOut);
    }
    midCaptionEl.style.opacity = midOpacity;

    // finale
    var finaleOpacity = p > 0.965 ? clamp((p - 0.965) / 0.03, 0, 1) : 0;
    finaleEl.style.opacity = finaleOpacity;

    canvas.style.transform = p > 0.965 ? 'scale(1.035)' : 'scale(1)';

    progressCountEl.textContent = String(Math.round(p * 100)).padStart(2, '0') + '%';
    railFillEl.style.height = (p * 100) + '%';
  }

  function render(p){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // draw order: least-settled first, most-settled last, so pieces
    // that have arrived sit visually "on top" of ones still arriving
    var order = pieces.slice().sort(function(a, b){
      return a._local - b._local;
    });

    for (var i = 0; i < order.length; i++){
      var piece = order[i];
      var local = piece._local;
      if (local <= 0) continue;

      var eased = local >= 1 ? 1 : easeOutBack(local, piece.settleOvershoot);

      var dx = piece.startDX * (1 - eased);
      var dy = piece.startDY * (1 - eased);
      var rot = piece.startRot * (1 - eased);

      // a small floaty wobble while still travelling, settles to 0
      var wobble = (1 - clamp(local, 0, 1)) * piece.wobbleAmp;
      var wob = Math.sin((p * 14) + piece.wobbleSeed) * wobble;

      var alpha = clamp(local / 0.12, 0, 1);

      ctx.save();
      ctx.globalAlpha = alpha;

      // soft shadow while piece is still in flight
      if (local < 0.985){
        ctx.shadowColor = 'rgba(28,27,24,0.25)';
        ctx.shadowBlur = 18 * (1 - clamp(local,0,1)) + 3;
        ctx.shadowOffsetY = 10 * (1 - clamp(local,0,1)) + 1;
      } else {
        ctx.shadowColor = 'rgba(28,27,24,0.12)';
        ctx.shadowBlur = 2;
        ctx.shadowOffsetY = 1;
      }

      ctx.translate(piece.cx, piece.cy);
      ctx.translate(dx + wob, dy);
      ctx.rotate(rot);
      ctx.translate(-piece.cx, -piece.cy);

      tracePiece(ctx, piece);
      ctx.clip();
      ctx.drawImage(img, puzzleX, puzzleY, puzzleW, puzzleH);
      ctx.restore();

      // seam line, only once a piece is basically home
      if (local > 0.7){
        ctx.save();
        ctx.globalAlpha = alpha * clamp((local - 0.7) / 0.3, 0, 1) * 0.5;
        ctx.translate(piece.cx, piece.cy);
        ctx.translate(dx + wob, dy);
        ctx.rotate(rot);
        ctx.translate(-piece.cx, -piece.cy);
        tracePiece(ctx, piece);
        ctx.strokeStyle = 'rgba(28,27,24,0.5)';
        ctx.lineWidth = 0.75;
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  function loop(){
    // ease progress toward target for a slightly cinematic lag,
    // rather than a 1:1 jump on every scroll tick
    progress += (targetProgress - progress) * 0.14;
    if (Math.abs(targetProgress - progress) < 0.0004) progress = targetProgress;

    var p = progress;
    for (var i = 0; i < pieces.length; i++){
      var piece = pieces[i];
      var local = (p - piece.delay) / piece.duration;
      if (p > 0.985) local = 1; // guarantee a clean, fully-assembled hold
      piece._local = clamp(local, local < 0 ? local : 0, 1.15);
    }

    render(p);
    updateChrome(p);

    requestAnimationFrame(loop);
  }

})();
